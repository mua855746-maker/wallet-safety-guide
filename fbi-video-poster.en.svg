<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">FBI Operation Level Up video cover</title>
  <desc id="desc">A preview card for an FBI video about cryptocurrency investment fraud.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10251b"/><stop offset="1" stop-color="#203a2b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#cce78a" stop-opacity=".18"/><stop offset="1" stop-color="#cce78a" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1010" cy="240" r="340" fill="url(#glow)"/>
  <g fill="none" stroke="#d6e5cf" stroke-opacity=".12" stroke-width="2"><path d="M790 126h270l92 92v270H882l-92-92z"/><path d="M842 180h210M842 220h140M842 468h265"/></g>
