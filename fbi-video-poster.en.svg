  <text x="76" y="260" fill="#f5f7ee" font-family="Arial,sans-serif" font-size="65" font-weight="700">OPERATION</text>
  <text x="76" y="339" fill="#cce78a" font-family="Arial,sans-serif" font-size="75" font-weight="700">LEVEL UP</text>
