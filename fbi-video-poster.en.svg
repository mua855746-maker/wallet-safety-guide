  <text x="80" y="438" fill="#aab9aa" font-family="Arial,sans-serif" font-size="21">Scam awareness · Approx. 5 minutes</text>
  <circle cx="1040" cy="344" r="76" fill="#cce78a" fill-opacity=".95"/>
  <path d="M1027 305l57 39-57 39z" fill="#183326"/>
