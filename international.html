ound:#f2f6f3;border:1px solid #e0e9e4;border-radius:9px;padding:13px;margin:13px 0;color:#405952}.choices{display:grid;gap:9px}.choice{width:100%;text-align:left;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font:600 13px/1.6 var(--sans);cursor:pointer}.choice:hover{border-color:#68a392;background:#f6fbf8}.choice[disabled]{cursor:default}.feedback{margin-top:13px;padding:12px;border-radius:9px;background:#edf7f0;color:#345c43}.next{border:0;border-radius:8px;background:var(--teal);color:#fff;padding:10px 14px;margin-top:12px;font-weight:700;cursor:pointer}.complete{padding:20px;text-align:center}.complete h3{font-size:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.info{padding:18px}.info h3{font-size:16px;margin:5px 0}.info p{margin:0;color:var(--muted);font-size:13px}.checklist{padding:18px}.check{display:flex;gap:11px;align-items:flex-start;border-bottom:1px solid var(--line);padding:11px 2px;font-size:13px}.check input{accent-color:#237868;width:18px;height:18px;flex:0 0 auto;margin:2px 0}.note{margin-top:13px;color:var(--muted);font-size:12px}.wallets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.wallet{padding:17px}.wallet-head{display:flex;justify-content:space-between;gap:8px}.wallet-tag{font-size:9px;color:#55766f;font-weight:750;letter-spacing:.5px}.wallet h3{font-size:15px;margin:9px 0}.wallet p{font-size:12px;color:var(--muted);margin:0}.redflag{margin-top:10px;padding:9px 11px;border-left:3px solid #d27459;background:#fff4f0;color:#82483d;font-size:11px;border-radius:0 7px 7px 0}.video-card{padding:18px}.video-card video{display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#061112;border-radius:10px}.video-card p{font-size:12px;color:var(--muted)}details{padding:14px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;font-weight:700}.footer{margin-top:46px;background:#102d32;color:#e1eeea;padding:26px 0}.footer p{color:#b9cbc5;font-size:12px}.small{font-size:11px;color:var(--muted)}@media(max-width:700px){.wrap{width:calc(100% - 30px)}.top{flex-wrap:wrap}.nav{width:100%;order:3;justify-content:space-between;gap:7px;overflow:auto}.nav a{font-size:10px;white-space:nowrap}.hero{grid-template-columns:1fr;padding:36px 0 24px;gap:17px}.hero h1{font-size:43px;letter-spacing:-1.5px}.hero p{font-size:14px}.hero-art{min-height:240px}.quick{grid-template-columns:1fr}.quick article{padding:13px}.grid,.wallets{grid-template-columns:1fr}.quiz{padding:15px}.quiz-top{font-size:10px}}

const T={
es:{name:'Español',brand:'Seguridad para wallets',nav:['Antes de operar','Conceptos','Lista de seguridad','Estafas','Preguntas'],hero:['GUÍA DE SEGURIDAD PARA CRIPTOWALLETS','Antes de enviar, intercambiar o firmar: haz una pausa.','Una guía independiente para comprobar direcciones, redes y permisos antes de aprobar una transacción.','Haz la comprobación de 60 s','Ver señales de estafa','Sin conexión a la wallet','Nunca pedimos tu frase de recuperación'],quick:[['Protege tu frase de recuperación','Ningún agente, web o herramienta legítima debe pedírtela.'],['Revisa antes de firmar','Comprueba la dirección completa, la red y el permiso solicitado.'],['Desconfía de la urgencia','Las promesas de ganancias y las comisiones de desbloqueo son señales de alerta.']],quiz:['COMPROBACIÓN PRÁCTICA · 60 SEGUNDOS','¿Detectarías estas señales de alerta?','Tres situaciones habituales. Elige cómo actuar para ver una explicación práctica. No se conecta ninguna wallet ni se guardan respuestas.','Situación','Siguiente situación','Terminar','Volver a empezar','Has completado la comprobación.','Pausa ante la presión. Verifica por un canal oficial independiente, lee la operación exacta y nunca compartas tu frase de recuperación.',['Un mensaje dice que congelarán tu wallet en 10 minutos.','“Actividad inusual. Introduce aquí tu frase de recuperación para desbloquear la wallet.”','Abrir el enlace y actuar deprisa.','Cerrar el enlace y verificar desde la app oficial o una dirección que ya conozcas. Nunca compartir la frase.','Una DApp pide permiso ilimitado para un intercambio pequeño.','“Permite que este contrato gaste todos tus tokens.” No reconoces el dominio.','Aprobar porque el logotipo parece conocido.','Cancelar y verificar el dominio, el contrato y el alcance del permiso.','Tras una pérdida, un supuesto experto promete recuperar fondos por adelantado.','“Paga el depósito y después recuperaremos tus criptomonedas.”','Pagar una cantidad pequeña para probarlo.','Cortar el contacto, guardar pruebas y pedir ayuda a la plataforma o a las autoridades locales.'],['La urgencia y la solicitud de la frase son señales claras de fraude. Cierra el mensaje y verifica por un canal oficial independiente.','Una web o una persona de soporte nunca necesita tu frase de recuperación. No la introduzcas ni la compartas.','Un permiso ilimitado puede poner en riesgo tus tokens. Cancela y comprueba cada detalle antes de firmar.','Un logotipo conocido no demuestra que una web sea auténtica. Comprueba el dominio y el permiso solicitado.','Las solicitudes de pago anticipado para recuperar criptomonedas son una señal de estafa.','No pagues ni permitas acceso remoto. Guarda los registros y contacta con tu plataforma y las autoridades.']],basics:['LO ESENCIAL','Qué debes comprobar antes de operar','Los criptoactivos permanecen en la blockchain; la wallet administra las claves que autorizan operaciones. La autocustodia te da control y también responsabilidad.','La frase de recuperación','Quien la obtiene puede controlar la wallet. Guárdala sin conexión y nunca la escribas en una web, chat o formulario de soporte.','Dirección y red','Comprueba la dirección completa y la red en la pantalla del dispositivo. Para una dirección nueva, haz primero una pequeña prueba.','Firmas y permisos','Lee qué contrato recibe autorización, qué activos afecta y cuál es el alcance. Cancela si no coincide con la operación que esperabas.'],check:['LISTA PREVIA','Cinco comprobaciones antes de firmar','Usa esta lista como recordatorio, no como garantía de seguridad.','Abre la app desde una fuente oficial o un marcador de confianza, no desde mensajes inesperados.','Comprueba la dirección completa del destinatario y la red antes de enviar.','Lee los detalles y el alcance del permiso en la wallet antes de firmar.','Rechaza ganancias garantizadas, premios urgentes y pagos anticipados para recuperar fondos.','Mantén las palabras de recuperación privadas, sin conexión y protegidas contra pérdida o daño.','Completa cada paso para marcarlo. Una lista completa no garantiza que una transacción sea segura.'],scams:['ALERTAS DE ESTAFA','Ejemplos de suplantación de wallets','Estos ejemplos describen fraudes que imitan marcas de wallets; no acusan a los proveedores mencionados. Confirma siempre los canales actuales en la app o web oficial.','Señal de alerta: nadie legítimo debe pedir tu frase de recuperación, clave privada o PIN.','Conclusión: si te presionan para compartir información, instalar una herramienta o firmar algo que no entiendes, detente y verifica.'],cards:[['TokenPocket','SUPUESTO ADMINISTRADOR','Un “administrador” te escribe en privado','Pueden ofrecer arreglar un problema y pedir una comisión o la frase de recuperación.','Señal: mensaje privado no solicitado o pago para desbloquear.'],['imToken','APP FALSA','Una wallet clonada en los resultados','Apps y soporte falsos pueden imitar nombre e icono para que importes la wallet.','Señal: desarrollador distinto o web con caracteres añadidos.'],['TronLink','TOKEN / QR FALSO','Promesas de arbitraje o airdrop','Un token o promoción falsa puede pedir USDT, conexión DApp o escaneo QR.','Señal: enviar fondos para liberar un premio.'],['OneKey','DISPOSITIVO ALTERADO','El hardware llega “ya inicializado”','Una tarjeta con palabras ya escritas puede exponer la wallet a otra persona.','Señal: PIN o frase preestablecidos.'],['Bitget Wallet','ENLACE DE PHISHING','Avisos de premios o cuenta bloqueada','Mensajes y páginas falsas usan urgencia para que inicies sesión o conectes la wallet.','Señal: cuenta atrás o dominio no oficial.'],['MetaMask','SOPORTE FALSO','Un “técnico” pide tu frase','El falso soporte puede guiarte a extensiones, webs o permisos maliciosos.','Señal: solicitud de frase o acceso remoto.'],['Base App','RECOMPENSA FALSA','Un supuesto token oficial de Base','Campañas falsas usan marcas conocidas para pedir conexión, firma o datos de recuperación.','Señal: frase de recuperación para reclamar.'],['Trust Wallet','VERIFICACIÓN FALSA','Una página pide sincronizar la wallet','Una web falsa puede pedir conectar la wallet y firmar una operación peligrosa.','Señal: página de verificación que solicita tus palabras.']],video:['VÍDEO ANTIFRAUDE','Fraude de inversión en criptomonedas','Vídeo oficial del FBI Operation Level Up, integrado en esta página. Audio original en inglés y pistas de subtítulos traducidos. El navegador puede bloquear la reproducción automática.','Fuente: FBI · Operation Level Up.'],faq:['RESPUESTAS RÁPIDAS','Preguntas frecuentes','¿Una wallet fría elimina todos los riesgos?','No. Reduce cierta exposición en línea, pero no evita phishing, direcciones erróneas, dispositivos falsos o copias de seguridad inseguras.','¿Debo compartir la frase con soporte?','No. Nunca compartas la frase de recuperación, la clave privada ni el PIN.','¿Qué hago si la he revelado?','Considera que la wallet puede estar comprometida. Desde un dispositivo fiable, sigue la guía oficial para proteger los fondos restantes. No pagues a supuestos recuperadores.'],footer:'Contenido educativo independiente para personas que usan wallets de criptomonedas. No introduzcas aquí frases de recuperación ni claves privadas.',source:'Información educativa; no es asesoramiento financiero ni una auditoría de seguridad.'},
fr:{name:'Français',brand:'Sécurité des portefeuilles',nav:['Avant une transaction','Notions','Liste de sécurité','Arnaques','FAQ'],hero:['GUIDE DE SÉCURITÉ DES PORTEFEUILLES CRYPTO','Avant d’envoyer, d’échanger ou de signer : faites une pause.','Un guide indépendant pour vérifier les adresses, les réseaux et les autorisations avant de valider une transaction.','Faire le contrôle en 60 s','Voir les signaux d’arnaque','Aucune connexion au portefeuille','Nous ne demandons jamais votre phrase secrète'],quick:[['Protégez votre phrase de récupération','Aucun service ou outil légitime ne doit vous la demander.'],['Vérifiez avant de signer','Contrôlez l’adresse complète, le réseau et l’autorisation demandée.'],['Méfiez-vous de l’urgence','Gains garantis et frais de déblocage sont des signaux d’alerte.']],quiz:['EXERCICE PRATIQUE · 60 SECONDES','Repérerez-vous ces signaux d’alerte ?','Trois situations courantes. Choisissez une réaction pour obtenir une explication. Aucun portefeuille n’est connecté et les réponses ne sont pas enregistrées.','Situation','Situation suivante','Terminer','Recommencer','Vous avez terminé l’exercice.','En cas de pression ou de doute, faites une pause. Vérifiez par un canal officiel distinct, lisez l’opération exacte et ne partagez jamais votre phrase de récupération.',['Un message affirme que votre portefeuille sera bloqué dans dix minutes.','« Activité inhabituelle. Saisissez votre phrase de récupération ici pour débloquer le portefeuille. »','Cliquer vite sur le lien.','Fermer le lien et vérifier depuis l’application officielle ou un site déjà connu. Ne jamais partager la phrase.','Une DApp demande une autorisation illimitée pour un petit échange.','« Autorisez ce contrat à dépenser tous vos jetons. » Le domaine vous est inconnu.','Accepter car le logo semble familier.','Annuler et vérifier le domaine, le contrat et la portée de l’autorisation.','Après une perte, un prétendu expert garantit la récupération contre un paiement anticipé.','« Payez le dépôt, puis nous récupérerons vos cryptomonnaies. »','Payer une petite somme pour tester.','Cesser le contact, conserver les preuves et demander de l’aide à la plateforme ou aux autorités locales.'],['L’urgence et la demande de phrase sont des signes évidents d’escroquerie. Fermez le message et vérifiez par un canal officiel indépendant.','Un site ou un support légitime n’a jamais besoin de votre phrase de récupération. Ne la saisissez et ne la partagez pas.','Une autorisation illimitée peut exposer vos jetons. Annulez et vérifiez chaque détail avant de signer.','Un logo connu ne prouve pas qu’un site est authentique. Vérifiez le domaine et l’autorisation demandée.','Les paiements anticipés pour récupérer des cryptomonnaies sont un signal d’arnaque.','Ne payez pas et n’accordez aucun accès à distance. Conservez les échanges et contactez votre plateforme et les autorités.']],basics:['L’ESSENTIEL','À vérifier avant une transaction','Les cryptoactifs restent sur la blockchain ; le portefeuille gère les clés qui autorisent les opérations. L’autonomie implique aussi des responsabilités.','Phrase de récupération','Quiconque l’obtient peut prendre le contrôle du portefeuille. Gardez-la hors ligne et ne la saisissez jamais sur un site, dans un chat ou un formulaire d’assistance.','Adresse et réseau','Vérifiez l’adresse complète et le réseau sur l’écran de l’appareil. Pour une nouvelle adresse, commencez par un petit transfert test.','Signatures et autorisations','Vérifiez le contrat, les actifs concernés et l’étendue de l’autorisation. Annulez si cela ne correspond pas à l’opération prévue.'],check:['LISTE AVANT TRANSACTION','Cinq vérifications avant de signer','Utilisez cette liste comme rappel, pas comme garantie de sécurité.','Ouvrez l’application depuis une source officielle ou un favori fiable, jamais depuis un message inattendu.','Vérifiez l’adresse complète du destinataire et le réseau avant l’envoi.','Lisez les détails et l’étendue de l’autorisation dans le portefeuille avant de signer.','Ignorez les gains garantis, les cadeaux urgents et les frais anticipés de récupération.','Gardez les mots de récupération privés, hors ligne et protégés contre la perte ou les dégâts.','Cochez chaque étape terminée. Une liste remplie ne garantit pas qu’une transaction est sûre.'],scams:['VIGILANCE ARNAQUES','Exemples d’usurpation de portefeuilles','Ces exemples décrivent des arnaques qui imitent des marques ; ils n’accusent pas les fournisseurs cités. Vérifiez les canaux actuels dans l’application ou le site officiel.','Aucun service légitime ne doit demander votre phrase de récupération, clé privée ou code PIN.','Conclusion : si l’on vous presse de partager des données, installer un outil ou signer sans comprendre, arrêtez-vous et vérifiez.'],cards:[['TokenPocket','FAUX ADMINISTRATEUR','Un « administrateur » vous écrit en privé','Un imposteur prétend résoudre un problème et demande des frais ou la phrase de récupération.','Signal : message privé non sollicité ou frais de déblocage.'],['imToken','FAUSSE APPLICATION','Un portefeuille cloné dans les résultats','De fausses applications et équipes d’assistance imitent le nom et l’icône pour vous faire importer le portefeuille.','Signal : développeur différent ou domaine modifié.'],['TronLink','FAUX JETON / QR','Promesse d’arbitrage ou d’airdrop','Un faux jeton ou une promotion peut demander des USDT, une connexion DApp ou un scan QR.','Signal : transfert demandé pour débloquer une récompense.'],['OneKey','APPAREIL MODIFIÉ','Le matériel arrive « déjà initialisé »','Une carte contenant déjà des mots peut exposer le portefeuille à quelqu’un d’autre.','Signal : code PIN ou phrase préconfigurés.'],['Bitget Wallet','LIEN D’HAMEÇONNAGE','Alerte de gain ou de compte bloqué','Les faux messages et sites créent l’urgence pour vous faire connecter le portefeuille.','Signal : compte à rebours ou domaine non officiel.'],['MetaMask','FAUX SUPPORT','Un « technicien » demande votre phrase','Un faux support peut vous guider vers une extension, un site ou une autorisation malveillante.','Signal : demande de phrase secrète ou d’accès distant.'],['Base App','FAUSSE RÉCOMPENSE','Un prétendu jeton officiel Base','De fausses campagnes usurpent des marques pour demander une connexion, une signature ou des données de récupération.','Signal : phrase demandée pour réclamer un gain.'],['Trust Wallet','FAUSSE VÉRIFICATION','Une page demande de synchroniser le portefeuille','Un faux site peut demander une connexion puis une signature dangereuse.','Signal : page de vérification demandant vos mots secrets.']],video:['VIDÉO DE PRÉVENTION','Fraude à l’investissement en cryptomonnaies','Vidéo officielle du FBI Operation Level Up intégrée à cette page. Audio original en anglais et pistes de sous-titres traduites. Le navigateur peut bloquer la lecture automatique.','Source : FBI · Operation Level Up.'],faq:['RÉPONSES RAPIDES','Questions fréquentes','Un portefeuille froid élimine-t-il tous les risques ?','Non. Il réduit certaines expositions en ligne, mais pas l’hameçonnage, les erreurs d’adresse, les faux appareils ou les sauvegardes non sécurisées.','Dois-je communiquer ma phrase au support ?','Non. Ne partagez jamais votre phrase de récupération, votre clé privée ou votre code PIN.','Que faire si je l’ai révélée ?','Considérez le portefeuille comme compromis. Depuis un appareil fiable, suivez des consignes officielles pour protéger les fonds restants. Ne payez pas de prétendus récupérateurs.'],footer:'Contenu éducatif indépendant destiné aux utilisateurs de portefeuilles crypto. Ne saisissez pas ici de phrase de récupération ni de clé privée.',source:'Information éducative ; ni conseil financier ni audit de sécurité.'},
de:{name:'Deutsch',brand:'Sicherheit für Krypto-Wallets',nav:['Vor dem Transfer','Grundlagen','Sicherheitscheck','Betrugswarnungen','FAQ'],hero:['SICHERHEITSLEITFADEN FÜR KRYPTO-WALLETS','Vor dem Senden, Tauschen oder Signieren: kurz innehalten.','Ein unabhängiger Leitfaden zum Prüfen von Adressen, Netzwerken und Berechtigungen, bevor du eine Transaktion bestätigst.','60-Sekunden-Check starten','Betrugszeichen ansehen','Keine Wallet-Verbindung','Wir fragen nie nach deiner Wiederherstellungsphrase'],quick:[['Wiederherstellungsphrase schützen','Kein seriöser Support und kein Tool darf danach fragen.'],['Vor dem Signieren prüfen','Vollständige Adresse, Netzwerk und angefragte Berechtigung prüfen.'],['Bei Zeitdruck misstrauisch sein','Garantierte Gewinne und Freischaltgebühren sind Warnsignale.']],quiz:['PRAXISCHECK · 60 SEKUNDEN','Erkennst du diese Warnsignale?','Drei typische Situationen. Wähle eine Reaktion und erhalte eine kurze Erklärung. Keine Wallet wird verbunden; Antworten werden nicht gespeichert.','Situation','Nächste Situation','Abschließen','Noch einmal','Du hast den Check abgeschlossen.','Bei Druck oder Unsicherheit: innehalten. Über einen unabhängigen offiziellen Kanal prüfen, den genauen Vorgang lesen und niemals die Wiederherstellungsphrase teilen.',['Eine Nachricht behauptet, deine Wallet werde in zehn Minuten gesperrt.','„Ungewöhnliche Aktivität. Gib hier deine Wiederherstellungsphrase ein, um die Wallet freizuschalten.“','Den Link sofort öffnen.','Link schließen und über die offizielle App oder eine bekannte Adresse prüfen. Phrase niemals teilen.','Eine DApp verlangt für einen kleinen Tausch eine unbegrenzte Token-Freigabe.','„Erlaube diesem Vertrag, alle deine Token auszugeben.“ Die Domain ist unbekannt.','Freigeben, weil das Logo vertraut aussieht.','Abbrechen und Domain, Vertrag sowie Umfang der Freigabe prüfen.','Nach einem Verlust verspricht ein angeblicher Experte gegen Vorauszahlung die Rückholung.','„Zahle zuerst die Gebühr, dann holen wir deine Coins zurück.“','Einen kleinen Betrag zum Testen zahlen.','Kontakt abbrechen, Belege sichern und Plattform oder örtliche Behörden kontaktieren.'],['Zeitdruck und die Bitte um deine Phrase sind klare Betrugszeichen. Nachricht schließen und unabhängig über einen offiziellen Kanal prüfen.','Seriöse Webseiten und Support benötigen niemals deine Wiederherstellungsphrase. Gib sie nicht ein und teile sie nicht.','Eine unbegrenzte Freigabe kann deine Token gefährden. Abbrechen und alle Details vor dem Signieren prüfen.','Ein bekanntes Logo beweist keine echte Website. Domain und angefragte Freigabe prüfen.','Vorauszahlungen für die Rückholung von Krypto sind ein deutliches Betrugszeichen.','Nicht zahlen und keinen Fernzugriff erlauben. Belege sichern und Plattform sowie Behörden kontaktieren.']],basics:['DIE GRUNDLAGEN','Was du vor einer Transaktion prüfen solltest','Krypto liegt auf der Blockchain; eine Wallet verwaltet die Schlüssel, mit denen Transaktionen autorisiert werden. Selbstverwahrung bedeutet auch Eigenverantwortung.','Wiederherstellungsphrase','Wer sie kennt, kann meist die Wallet kontrollieren. Offline aufbewahren und niemals in Websites, Chats oder Supportformulare eingeben.','Adresse und Netzwerk','Vollständige Empfängeradresse und Netzwerk auf dem Gerätebildschirm prüfen. Bei einer neuen Adresse zuerst einen kleinen Testbetrag senden.','Signaturen und Freigaben','Prüfen, welcher Vertrag Zugriff erhält, welche Assets betroffen sind und wie weit die Berechtigung reicht. Bei Abweichungen abbrechen.'],check:['CHECK VOR DEM TRANSFER','Fünf Prüfungen vor dem Signieren','Diese Liste ist eine Erinnerung, keine Sicherheitsgarantie.','App über eine offizielle Quelle oder ein bekanntes Lesezeichen öffnen, nicht über unerwartete Nachrichten.','Vollständige Empfängeradresse und Netzwerk vor dem Senden prüfen.','Transaktionsdetails und Umfang der Freigabe in der Wallet vor dem Signieren lesen.','Garantierte Gewinne, dringende Geschenke und Vorauszahlungen zur Rückholung ignorieren.','Wiederherstellungswörter privat, offline und vor Verlust oder Schäden geschützt aufbewahren.','Abgeschlossene Schritte markieren. Auch eine vollständige Liste garantiert keine sichere Transaktion.'],scams:['BETRUG ERKENNEN','Beispiele für Wallet-Imitationen','Diese Beispiele beschreiben Betrugsmaschen, die Wallet-Marken nachahmen; sie unterstellen den genannten Anbietern kein Fehlverhalten. Prüfe aktuelle Hinweise in der offiziellen App oder Website.','Kein seriöser Anbieter fragt nach Wiederherstellungsphrase, privatem Schlüssel oder PIN.','Fazit: Wenn du zum Teilen von Daten, Installieren eines Tools oder unklaren Signieren gedrängt wirst, stoppe und prüfe unabhängig.'],cards:[['TokenPocket','FALSCHER ADMIN','Ein „Admin“ schreibt dir privat','Betrüger bieten Hilfe an und verlangen Gebühren oder deine Wiederherstellungsphrase.','Warnsignal: unaufgeforderte DM oder Freischaltgebühr.'],['imToken','FALSCHE APP','Eine geklonte Wallet in Suchergebnissen','Gefälschte Apps und Support kopieren Name und Symbol, um dich zum Import zu bewegen.','Warnsignal: anderer Entwicklername oder veränderte Domain.'],['TronLink','FALSCHER TOKEN / QR','Arbitrage- oder Airdrop-Versprechen','Fake-Token und Aktionen verlangen USDT, DApp-Verbindung oder QR-Scan.','Warnsignal: erst Geld senden, um einen Gewinn freizuschalten.'],['OneKey','MANIPULIERTES GERÄT','Das Hardware-Wallet ist „bereits eingerichtet“','Eine Karte mit vorab notierten Wörtern kann anderen Zugriff ermöglichen.','Warnsignal: voreingestellte PIN oder Phrase.'],['Bitget Wallet','PHISHING-LINK','Gewinn- oder Kontosperrungswarnung','Gefälschte Nachrichten und Websites erzeugen Zeitdruck, damit du die Wallet verbindest.','Warnsignal: Countdown oder nicht offizielle Domain.'],['MetaMask','FALSCHER SUPPORT','Ein „Techniker“ verlangt deine Phrase','Fake-Support führt zu gefälschten Erweiterungen, Websites oder gefährlichen Freigaben.','Warnsignal: Phrase oder Fernzugriff wird verlangt.'],['Base App','FALSCHE BELOHNUNG','Ein angeblicher offizieller Base-Token','Fake-Aktionen missbrauchen Marken, um Verbindung, Signatur oder Wiederherstellungsdaten zu verlangen.','Warnsignal: Phrase nötig, um Belohnung abzuholen.'],['Trust Wallet','FALSCHE PRÜFUNG','Eine Seite verlangt die Wallet-Synchronisierung','Eine Fake-Seite fordert Verbindung und eine gefährliche Signatur.','Warnsignal: Prüfseite verlangt Wiederherstellungswörter.']],video:['BETRUGSPRÄVENTION','Krypto-Anlagebetrug','Das offizielle FBI-Video zu Operation Level Up ist hier eingebunden. Originalton auf Englisch, dazu übersetzte Untertitel. Der Browser kann die automatische Wiedergabe blockieren.','Quelle: FBI · Operation Level Up.'],faq:['KURZE ANTWORTEN','Häufige Fragen','Beseitigt eine Cold Wallet alle Risiken?','Nein. Sie reduziert bestimmte Online-Risiken, aber nicht Phishing, falsche Adressen, gefälschte Geräte oder unsichere Backups.','Soll ich dem Support meine Phrase mitteilen?','Nein. Teile niemals Wiederherstellungsphrase, privaten Schlüssel oder PIN.','Was tun, wenn ich sie offengelegt habe?','Gehe von einer möglichen Kompromittierung aus. Schütze verbleibende Werte mit einem vertrauenswürdigen Gerät und offiziellen Anleitungen. Zahle keinen angeblichen Rückholern.'],footer:'Unabhängige Bildungsinhalte für Nutzer von Krypto-Wallets. Gib hier niemals Wiederherstellungsphrasen oder private Schlüssel ein.',source:'Nur Bildungsinformationen; keine Finanzberatung und kein Sicherheitsaudit.'},
ja:{name:'日本語',brand:'暗号資産ウォレット安全ガイド',nav:['取引前に','基礎知識','安全チェック','詐欺に注意','よくある質問'],hero:['暗号資産ウォレット安全ガイド','送金・交換・署名の前に、いったん確認。','取引を承認する前に、アドレス・ネットワーク・権限を確認するための独立したガイドです。','60秒チェックを始める','詐欺のサインを見る','ウォレット接続なし','リカバリーフレーズは求めません'],quick:[['リカバリーフレーズを守る','正規のサポートやツールが尋ねることはありません。'],['署名前に確認する','送金先アドレス、ネットワーク、許可範囲を確認。'],['急かされたら一度止まる','確実な利益や解除手数料の要求は危険信号です。']],quiz:['60秒の実践チェック','この危険サインに気づけますか？','よくある3つの状況です。対応を選ぶと、理由と安全な次の行動を確認できます。ウォレット接続や回答の保存はありません。','状況','次の状況へ','完了','もう一度','チェック完了です。','急かされたり内容が不明な場合は一度停止。別の公式窓口で確認し、署名内容を読み、リカバリーフレーズを他人に教えないでください。',['10分以内に操作しないとウォレットを凍結するとメッセージが届いた。','「異常を検出しました。解除するため、ここにリカバリーフレーズを入力してください。」','凍結を避けるため、すぐリンクを開く。','リンクを閉じ、公式アプリまたは既知のサイトで確認する。フレーズは絶対に共有しない。','少額交換のはずなのに、DAppが無制限のトークン使用許可を求めている。','「このコントラクトに全トークンの使用を許可してください。」見覚えのないドメイン。','ロゴが見慣れているので許可する。','キャンセルし、ドメイン・コントラクト・許可範囲を確認する。','損失後、回収専門家を名乗る人が前払いで資金を取り戻すと約束した。','「調査費用を先に払えば暗号資産を回収します。」','少額を払い、本物か試す。','連絡を止め、証拠を保存し、取引所または地域当局に相談する。'],['急かすこととフレーズの要求は明らかな詐欺の兆候です。メッセージを閉じ、別の公式窓口から確認してください。','正規のサイトやサポートにリカバリーフレーズを渡す必要はありません。入力も共有もしないでください。','無制限の許可はトークンを危険にさらす可能性があります。キャンセルし、署名前に詳細を確認してください。','見慣れたロゴだけでは本物と判断できません。ドメインと許可内容を確認してください。','暗号資産の回収をうたう前払い要求は詐欺の危険信号です。','支払いや遠隔操作を許可せず、証拠を保存して取引所と当局に連絡してください。']],basics:['まず確認','取引前に確認すること','暗号資産はブロックチェーン上にあり、ウォレットは取引を承認する鍵を管理します。自己管理には責任も伴います。','リカバリーフレーズ','知っている人は通常ウォレットを操作できます。オフラインで保管し、Webサイトやチャット、サポートフォームには入力しないでください。','アドレスとネットワーク','端末の画面で送金先アドレス全体とネットワークを確認。初めての送金先には少額でテストします。','署名と許可','どのコントラクトに、どの資産への、どの範囲の許可を与えるか確認。予定した操作と違う場合はキャンセルします。'],check:['取引前チェック','署名前の5つの確認','安全を保証するものではなく、確認のためのチェックリストです。','予期しないメッセージのリンクではなく、公式アプリや信頼できるブックマークから開く。','送金前に宛先アドレス全体とネットワークを確認する。','署名前にウォレット上で取引内容と許可範囲を読む。','確実な利益、急なプレゼント、回収の前払い要求を信じない。','リカバリーフレーズは非公開・オフラインで、紛失や破損から守る。','確認できた項目にチェック。すべてチェックしても安全が保証されるわけではありません。'],scams:['詐欺への注意','ウォレットになりすます手口','以下はウォレットブランドを装う詐欺例であり、記載ブランドが詐欺に関与しているという意味ではありません。公式アプリやサイトで確認してください。','正規の窓口がリカバリーフレーズ、秘密鍵、PINを尋ねることはありません。','結論：情報の共有、ツールのインストール、内容不明の署名を急かされたら中止し、別の公式窓口で確認してください。'],cards:[['TokenPocket','偽の管理者','グループ管理者から個別メッセージ','問題を解決すると言って手数料やリカバリーフレーズを求める場合があります。','危険信号：突然のDMや解除手数料。'],['imToken','偽アプリ','検索結果にあるそっくりなウォレット','偽アプリやサポートが名前とアイコンをまねて、ウォレットのインポートを促します。','危険信号：開発者名やドメインが違う。'],['TronLink','偽トークン・QR','裁定取引やエアドロップの誘い','偽のトークンや企画でUSDT送金、DApp接続、QR読取を求めることがあります。','危険信号：報酬受取に先払いを要求。'],['OneKey','改ざん端末','初期化済みのハードウェアウォレット','単語が書かれたカードが同梱されていると、第三者に情報を知られている恐れがあります。','危険信号：PINやフレーズが設定済み。'],['Bitget Wallet','フィッシングリンク','当選やアカウント停止の通知','偽メッセージやサイトで急がせ、ログインやウォレット接続を促します。','危険信号：カウントダウンや非公式ドメイン。'],['MetaMask','偽サポート','担当者がフレーズを要求','偽サポートが偽拡張機能やサイト、危険な許可へ誘導する場合があります。','危険信号：フレーズや遠隔操作を要求。'],['Base App','偽の報酬','Base公式を装うトークン','偽キャンペーンで接続、署名、リカバリー情報の入力を求めます。','危険信号：報酬受取にフレーズが必要。'],['Trust Wallet','偽の検証','同期を求める偽ページ','偽サイトでウォレットを接続させ、危険な取引に署名させる場合があります。','危険信号：検証ページで単語を要求。']],video:['詐欺防止動画','暗号資産投資詐欺','FBI Operation Level Upの公式動画をページ内に掲載しています。音声は英語で、翻訳字幕を選択できます。ブラウザーが自動再生を制限する場合があります。','出典：FBI · Operation Level Up'],faq:['よくある質問','簡単な回答','コールドウォレットなら全て安全ですか？','いいえ。オンライン上の一部リスクを減らしますが、フィッシング、誤送金、偽端末、安全でないバックアップは防げません。','サポートにフレーズを伝えてもよいですか？','いいえ。リカバリーフレーズ、秘密鍵、PINを絶対に共有しないでください。','フレーズを漏らした場合は？','侵害された可能性があると考えてください。信頼できる端末から公式案内に従い、残る資産を保護してください。回収業者を名乗る人に支払わないでください。'],footer:'暗号資産ウォレット利用者向けの独立した教育情報です。このサイトにリカバリーフレーズや秘密鍵を入力しないでください。',source:'教育目的の情報であり、投資助言やセキュリティ監査ではありません。'},
pt:{name:'Português',brand:'Guia de segurança para carteiras cripto',nav:['Antes de transacionar','Noções básicas','Lista de segurança','Golpes','Perguntas frequentes'],hero:['GUIA DE SEGURANÇA PARA CARTEIRAS CRIPTO','Antes de enviar, trocar ou assinar: pare e confira.','Um guia independente para verificar endereços, redes e permissões antes de aprovar uma transação.','Faça a verificação de 60 segundos','Veja sinais de golpe','Sem conexão à carteira','Nunca pedimos sua frase de recuperação'],quick:[['Proteja sua frase de recuperação','Nenhum suporte, site ou ferramenta legítima deve pedir sua frase.'],['Confira antes de assinar','Verifique o endereço completo, a rede e o alcance da permissão solicitada.'],['Desconfie da pressão','Promessas de lucro garantido e taxas para desbloquear fundos são sinais de alerta.']],quiz:['VERIFICAÇÃO PRÁTICA · 60 SEGUNDOS','Você reconheceria estes sinais de alerta?','Três situações comuns. Escolha como agir para ver uma explicação prática. Nenhuma carteira é conectada e suas respostas não são salvas.','Situação','Próxima situação','Concluir','Recomeçar','Você concluiu a verificação.','Se houver pressão ou algo não estiver claro, pare. Confirme por um canal oficial independente, leia os detalhes da transação e nunca compartilhe sua frase de recuperação.',['Uma mensagem diz que sua carteira será bloqueada em 10 minutos.','“Detectamos atividade incomum. Insira sua frase de recuperação para desbloquear a carteira.”','Abrir o link e agir rapidamente.','Fechar o link e conferir pelo app oficial ou por um endereço conhecido. Nunca compartilhar a frase.','Uma DApp pede aprovação ilimitada de tokens para uma pequena troca.','“Permita que este contrato use todos os seus tokens.” O domínio é desconhecido.','Aprovar porque o logotipo parece familiar.','Cancelar e conferir o domínio, o contrato e o alcance da permissão.','Depois de uma perda, um suposto especialista promete recuperar os fundos mediante pagamento antecipado.','“Pague uma taxa de rastreamento e devolveremos suas criptomoedas.”','Pagar um valor pequeno para testar.','Interromper o contato, guardar provas e procurar a plataforma ou as autoridades locais.'],['A urgência junto com o pedido da frase de recuperação é um sinal claro de golpe. Feche a mensagem e confirme por um canal oficial independente.','Um site ou agente de suporte legítimo nunca precisa da sua frase de recuperação. Não a digite nem compartilhe.','Uma permissão ilimitada pode colocar seus tokens em risco. Cancele e confira cada detalhe antes de assinar.','Um logotipo conhecido não prova que o site é verdadeiro. Confira o domínio e a permissão solicitada.','Cobranças antecipadas para recuperar criptomoedas são um forte sinal de golpe.','Não envie dinheiro nem permita acesso remoto. Guarde os registros e contate sua plataforma e as autoridades.']],basics:['O ESSENCIAL','O que conferir antes de transacionar','Os criptoativos são registrados na blockchain; a carteira administra as chaves que autorizam transações. A autocustódia traz controle e responsabilidade.','Frase de recuperação','Quem a obtém geralmente pode controlar a carteira. Guarde-a offline e nunca a digite em sites, chats ou formulários de suporte.','Endereço e rede','Confira o endereço completo do destinatário e a rede na tela do dispositivo. Ao enviar para um endereço novo, faça primeiro um pequeno teste.','Assinaturas e permissões','Confira qual contrato recebe autorização, quais ativos são afetados e o alcance da permissão. Cancele se não corresponder ao que esperava.'],check:['LISTA ANTES DA TRANSAÇÃO','Cinco verificações antes de assinar','Use esta lista como lembrete, não como garantia de segurança.','Abra o app por uma fonte oficial ou favorito confiável, nunca por links inesperados.','Confira o endereço completo do destinatário e a rede antes de enviar.','Leia os detalhes da transação e o alcance da permissão na carteira antes de assinar.','Desconfie de lucro garantido, prêmios urgentes e pagamento antecipado para recuperar fundos.','Mantenha a frase de recuperação privada e offline, protegida contra perda ou dano.','Marque os itens conferidos. Completar a lista não garante que uma transação seja segura.'],scams:['ALERTAS DE GOLPE','Exemplos de falsificação de carteiras','Estes exemplos descrevem golpes que imitam marcas de carteiras; não afirmam que os provedores citados estejam envolvidos. Confira os canais atuais no app ou site oficial.','Um canal legítimo de suporte nunca pede sua frase de recuperação, chave privada ou PIN.','Conclusão: se pressionarem você a compartilhar informações, instalar ferramentas ou assinar algo que não entende, pare e confirme por um canal oficial independente.'],cards:[['TokenPocket','Suporte falso','Um “administrador” do grupo chama você em privado','O impostor pode oferecer ajuda e pedir uma taxa ou sua frase de recuperação.','Sinal de alerta: mensagem privada inesperada ou taxa de desbloqueio.'],['imToken','App falso','Uma carteira com nome parecido nos resultados de busca','Apps e perfis de suporte falsos copiam nomes e ícones para induzir a importação da carteira.','Sinal de alerta: desenvolvedor ou domínio diferente.'],['TronLink','Token ou QR falso','Promessa de arbitragem, troca ou airdrop','Um token ou campanha falsa pode pedir envio de USDT, conexão a uma DApp ou leitura de QR code.','Sinal de alerta: depósito antecipado para liberar uma recompensa.'],['OneKey','Dispositivo adulterado','Carteira de hardware já inicializada','Um cartão com frase de recuperação preenchida pode indicar que outra pessoa conhece seus dados.','Sinal de alerta: PIN já configurado ou frase fornecida.'],['Bitget Wallet','Link de phishing','Aviso de prêmio ou conta bloqueada','Mensagens e sites falsos criam urgência para induzir login ou conexão da carteira.','Sinal de alerta: contagem regressiva ou domínio não oficial.'],['MetaMask','Suporte falso','Um “técnico” pede sua frase de recuperação','O falso suporte pode direcionar você a extensões maliciosas, sites ou permissões perigosas.','Sinal de alerta: pedido da frase ou de acesso remoto.'],['Base App','Recompensa falsa','Imitação de token ou campanha oficial da Base','Campanhas falsas podem pedir conexão, assinatura ou dados de recuperação.','Sinal de alerta: pedem a frase para liberar uma recompensa.'],['Trust Wallet','Verificação falsa','Página pede para sincronizar a carteira','Um site falso pode induzir uma conexão seguida de assinatura de transação perigosa.','Sinal de alerta: formulário de verificação pede palavras de recuperação.']],video:['VÍDEO DE PREVENÇÃO A GOLPES','Fraudes de investimento em criptomoedas','Este guia incorpora o vídeo oficial do FBI Operation Level Up. O áudio original é em inglês e há faixas de legendas traduzidas. O navegador pode bloquear a reprodução automática.','Fonte: FBI · Operation Level Up'],faq:['RESPOSTAS RÁPIDAS','Perguntas frequentes','Uma carteira fria elimina todos os riscos?','Não. Ela pode reduzir alguns riscos online, mas não impede phishing, endereços errados, dispositivos falsificados ou backups inseguros.','Posso informar minha frase de recuperação ao suporte?','Não. Nunca compartilhe sua frase de recuperação, chave privada ou PIN.','O que fazer se minha frase foi exposta?','Considere que a carteira pode estar comprometida. Use um dispositivo confiável e siga as orientações oficiais para proteger os ativos restantes. Não pague a quem promete recuperá-los.'],footer:'Material educativo independente para usuários de carteiras de criptomoedas. Nunca digite sua frase de recuperação ou chave privada neste site.',source:'Informação educativa; não é aconselhamento financeiro nem auditoria de segurança.'},
ko:{name:'한국어',brand:'암호화폐 지갑 보안 가이드',nav:['거래 전 확인','기초 지식','보안 체크리스트','사기 주의','자주 묻는 질문'],hero:['암호화폐 지갑 보안 가이드','전송·교환·서명 전, 잠시 멈추고 확인하세요.','거래를 승인하기 전에 주소, 네트워크, 권한을 확인하는 독립적인 안내입니다.','60초 자가 점검','사기 신호 보기','지갑 연결 없음','복구 문구를 요구하지 않습니다'],quick:[['복구 문구를 안전하게 보관','정상적인 지원 담당자나 도구는 복구 문구를 요구하지 않습니다.'],['서명 전에 확인','전체 주소, 네트워크, 요청된 권한 범위를 확인하세요.'],['급하게 재촉하면 의심','확정 수익 약속과 잠금 해제 비용은 위험 신호입니다.']],quiz:['60초 실전 점검','이 위험 신호를 알아볼 수 있나요?','흔한 상황 세 가지입니다. 대응을 고르면 이유와 안전한 다음 단계를 확인할 수 있습니다. 지갑에 연결하지 않으며 답변은 저장하지 않습니다.','상황','다음 상황','완료','다시 하기','점검을 마쳤습니다.','재촉을 받거나 내용이 불분명하면 멈추세요. 별도의 공식 경로로 확인하고 거래 내용을 읽으며 복구 문구를 절대 공유하지 마세요.',['10분 안에 조치하지 않으면 지갑을 동결하겠다는 메시지를 받았습니다.','“이상 활동이 감지되었습니다. 잠금을 해제하려면 복구 문구를 입력하세요.”','지갑이 동결되지 않도록 링크를 바로 연다.','링크를 닫고 공식 앱이나 이미 알고 있는 사이트에서 확인한다. 복구 문구는 공유하지 않는다.','작은 교환을 하려는데 DApp이 무제한 토큰 사용 권한을 요청합니다.','“이 컨트랙트가 모든 토큰을 사용하도록 허용하세요.” 낯선 도메인입니다.','로고가 익숙하니 승인한다.','취소하고 도메인, 컨트랙트, 권한 범위를 확인한다.','자산을 잃은 뒤 회수 전문가가 선불 비용을 받고 복구를 보장합니다.','“먼저 추적 비용을 내면 암호화폐를 돌려드립니다.”','소액을 내고 진짜인지 시험한다.','연락을 끊고 증거를 보관한 뒤 거래소나 현지 기관에 문의한다.'],['긴급성을 강조하며 복구 문구를 요구하는 것은 명백한 사기 신호입니다. 메시지를 닫고 별도의 공식 경로로 확인하세요.','정상적인 사이트나 지원 담당자는 복구 문구를 필요로 하지 않습니다. 입력하거나 공유하지 마세요.','무제한 권한은 토큰을 위험에 빠뜨릴 수 있습니다. 취소하고 서명 전에 세부 내용을 확인하세요.','익숙한 로고만으로 사이트가 진짜인지 확인할 수 없습니다. 도메인과 권한 내용을 점검하세요.','암호화폐 회수를 위한 선불 요구는 사기 가능성이 높은 신호입니다.','돈을 보내거나 원격 접근을 허용하지 마세요. 기록을 보관하고 거래소와 당국에 연락하세요.']],basics:['핵심 안내','거래 전에 확인할 사항','암호화폐는 블록체인에 기록되고 지갑은 거래 승인에 필요한 키를 관리합니다. 직접 보관에는 책임도 따릅니다.','복구 문구','복구 문구를 아는 사람은 보통 지갑을 제어할 수 있습니다. 오프라인으로 보관하고 웹사이트, 채팅, 지원 양식에 입력하지 마세요.','주소와 네트워크','기기 화면에서 전체 수신 주소와 네트워크를 확인하세요. 처음 보내는 주소에는 소액으로 먼저 시험하세요.','서명과 권한','어떤 컨트랙트에 어떤 자산의 어느 범위까지 권한을 주는지 확인하세요. 예상한 거래와 다르면 취소하세요.'],check:['거래 전 체크리스트','서명 전 다섯 가지 확인','이 목록은 보안 보장이 아니라 확인을 돕는 참고 자료입니다.','뜻밖의 메시지 링크 대신 공식 앱이나 신뢰할 수 있는 북마크에서 접속하세요.','전송 전에 전체 수신 주소와 네트워크를 확인하세요.','서명하기 전에 지갑에서 거래 내용과 권한 범위를 읽으세요.','확정 수익, 긴급 경품, 자산 회수 선불 요구를 믿지 마세요.','복구 문구는 비공개·오프라인으로 보관하고 분실과 손상에 대비하세요.','확인한 항목에 체크하세요. 모두 체크해도 거래 안전이 보장되지는 않습니다.'],scams:['사기 주의','지갑 사칭 사례','아래는 지갑 브랜드를 사칭하는 사기 수법이며 해당 업체가 사기에 연루됐다는 뜻이 아닙니다. 최신 안내는 공식 앱이나 사이트에서 확인하세요.','정상적인 지원 채널은 복구 문구, 개인 키, PIN을 요구하지 않습니다.','결론: 정보 공유, 도구 설치, 이해하지 못한 서명을 재촉하면 중단하고 별도의 공식 경로로 확인하세요.'],cards:[['TokenPocket','가짜 관리자','그룹 “관리자”가 개인 메시지를 보냄','문제를 해결해준다며 수수료나 복구 문구를 요구할 수 있습니다.','위험 신호: 갑작스러운 DM 또는 잠금 해제 비용.'],['imToken','가짜 앱','검색 결과의 모방 지갑','가짜 앱과 지원 계정이 이름과 아이콘을 베껴 지갑 가져오기를 유도합니다.','위험 신호: 개발자 정보나 도메인이 다름.'],['TronLink','가짜 토큰·QR','차익 거래 또는 에어드롭 제안','가짜 토큰이나 이벤트가 USDT 전송, DApp 연결, QR 스캔을 요구할 수 있습니다.','위험 신호: 보상 해제를 위한 선입금.'],['OneKey','변조된 기기','이미 초기화된 하드웨어 지갑','복구 문구가 적힌 카드가 있으면 다른 사람이 정보를 알고 있을 수 있습니다.','위험 신호: 설정된 PIN 또는 문구.'],['Bitget Wallet','피싱 링크','당첨 또는 계정 정지 알림','가짜 메시지와 사이트가 긴급함을 조성해 로그인이나 연결을 유도합니다.','위험 신호: 카운트다운 또는 비공식 도메인.'],['MetaMask','가짜 지원','“기술자”가 복구 문구를 요청','가짜 지원이 악성 확장 프로그램이나 사이트, 위험한 권한으로 유도할 수 있습니다.','위험 신호: 문구 또는 원격 접근 요청.'],['Base App','가짜 보상','Base 공식 토큰을 사칭','가짜 이벤트가 지갑 연결, 서명, 복구 정보 입력을 요구합니다.','위험 신호: 보상 수령에 복구 문구 필요.'],['Trust Wallet','가짜 인증','지갑 동기화를 요구하는 페이지','가짜 사이트가 지갑 연결 후 위험한 거래 서명을 요구할 수 있습니다.','위험 신호: 인증 페이지에서 복구 단어 요청.']],video:['사기 예방 영상','암호화폐 투자 사기','FBI Operation Level Up 공식 영상을 페이지에 포함했습니다. 원본 음성은 영어이며 번역 자막을 선택할 수 있습니다. 브라우저에서 자동 재생이 차단될 수 있습니다.','출처: FBI · Operation Level Up'],faq:['빠른 답변','자주 묻는 질문','콜드월렛이면 모든 위험이 없어지나요?','아니요. 일부 온라인 위험을 줄일 수 있지만 피싱, 잘못된 주소, 위조 기기, 안전하지 않은 백업을 막지는 못합니다.','지원 담당자에게 복구 문구를 알려줘도 되나요?','안 됩니다. 복구 문구, 개인 키, PIN은 절대 공유하지 마세요.','복구 문구를 노출했다면 어떻게 하나요?','지갑이 침해됐을 가능성을 고려하세요. 신뢰할 수 있는 기기에서 공식 안내를 따라 남은 자산을 보호하세요. 복구를 해준다는 사람에게 돈을 보내지 마세요.'],footer:'암호화폐 지갑 이용자를 위한 독립 교육 자료입니다. 이 사이트에 복구 문구나 개인 키를 입력하지 마세요.',source:'교육 정보이며 투자 조언이나 보안 감사가 아닙니다.'}
};
T.zh={name:'简体中文',brand:'加密钱包安全指南',nav:['交易前必读','基础知识','安全清单','防骗提醒','常见问题'],hero:['加密钱包安全指南','转账、兑换或签名前，先停一下。','这是一份独立指南，帮助你在确认交易前核对地址、网络与签名权限。','开始 60 秒自查','查看常见骗局','不连接钱包','不会索要助记词'],quick:[['保护好助记词','任何正规客服、网站或工具都不该向你索要。'],['签名前先核对','检查完整地址、网络和授权范围。'],['有人催促就暂停','保证收益、解冻费和私信都是危险信号。']],quiz:['60 秒 · 实战自查','这些危险信号，你能看出来吗？','三个常见情境。选择你的处理方式，查看原因和安全做法。不连接钱包，也不保存答案。','情境','下一个情境','完成自查','再做一次','自查完成。','遇到催促或看不懂的操作，先暂停；从独立官方渠道核实，仔细阅读交易内容，绝不透露助记词。',['有人称你的钱包将在 10 分钟内被冻结，要求你立即操作。','“检测到异常活动。请在此输入助记词，解除钱包限制。”','赶紧点链接，免得钱包被冻结。','关闭链接，通过官方应用或已知网址核实；绝不提供助记词。','小额兑换却被要求开放无限额代币授权。','“允许此合约使用你的全部代币。”你不认识这个域名。','看到熟悉的 Logo 就批准，之后再查看。','取消操作，核对域名、合约和授权范围。','资产受损后，有人自称链上专家，先收费并索要远程访问权限。','“先付追踪押金，找回后会退还。”','先付一小笔，看看对方是否靠谱。','停止联系、保存证据，并向交易平台或当地执法机构求助。'],['催促限时操作，又索要助记词，是明显危险信号。关闭消息，通过独立官方渠道核实。','正规网站或客服不需要你的助记词。不要输入或分享。','无限额授权可能危及代币。先取消，核对细节后再决定。','熟悉的 Logo 不代表网站真实。核对域名和授权内容。','追回加密资产前要求先交钱，是明显的诈骗信号。','不要付款或开放远程访问。保留记录，联系平台和当地执法机构。']],basics:['先了解','交易前要核对什么','加密资产记录在区块链上，钱包管理的是授权交易所需的密钥。自我托管也意味着自己承担备份责任。','助记词','掌握助记词的人通常可以控制钱包。离线保管，不要填进网站、聊天窗口或客服表单。','地址与网络','在设备屏幕上核对完整收款地址和网络。首次向新地址转账，先小额测试。','签名与授权','确认授权给哪个合约、涉及哪些资产、范围有多大。和预期操作不符就取消。'],check:['交易前清单','签名前的五项检查','这份清单用于提醒，不保证交易绝对安全。','从官方渠道或可信书签打开应用，不要点陌生消息里的链接。','转账前核对完整收款地址和网络。','签名前在钱包中阅读交易详情与授权范围。','不信稳赚承诺、紧急空投和先付费追回资产。','助记词离线、保密保存，并防止遗失或损坏。','完成一项再勾选。全部勾选也不代表交易一定安全。'],scams:['识别常见骗局','假冒钱包的常见手法','以下案例描述的是冒充钱包品牌的诈骗手法，不代表所列厂商参与诈骗。请通过官方应用或网站核对最新信息。','任何正规客服都不会索要助记词、私钥或 PIN。','结论：如果有人催你泄露信息、安装工具或盲目签名，请立即停止并独立核实。'],cards:[['TokenPocket','假管理员','群聊“管理员”私信你','对方可能以解决问题为由收取费用，或索取助记词。','信号：陌生私信或解冻费。'],['imToken','假应用','搜索结果里的仿冒钱包','假应用和客服会仿造名称与图标，诱导你导入钱包。','信号：开发者信息或网址不符。'],['TronLink','假代币 / 假二维码','套利或空投活动引你转账','假代币或活动可能要求转 USDT、连接 DApp 或扫描二维码。','信号：领取奖励前要求先转账。'],['OneKey','设备被动手脚','收到“已初始化”的硬件钱包','写有助记词的卡片可能让他人提前掌握恢复信息。','信号：预设 PIN 或助记词。'],['Bitget Wallet','钓鱼链接','中奖或账户异常通知','假网站和短信用紧急提示诱导登录或连接钱包。','信号：倒计时或非官方域名。'],['MetaMask','假客服','“技术支持”索要助记词','假客服可能引导你安装恶意扩展或签署危险授权。','信号：索要助记词或远程控制权限。'],['Base App','假奖励','冒充 Base 官方代币活动','假活动会诱导连接钱包、签名或输入恢复信息。','信号：领取奖励必须提交助记词。'],['Trust Wallet','假验证','要求同步钱包的页面','钓鱼页面可能诱导连接钱包并签署危险操作。','信号：验证页面索要恢复短语。']],video:['反诈视频','加密投资诈骗','页面内直接播放 FBI Operation Level Up 官方视频，英文原声，并提供多语言字幕。浏览器可能限制自动播放。','来源：FBI · Operation Level Up'],faq:['快速问答','常见问题','冷钱包能消除所有风险吗？','不能。它可以减少部分联网风险，但不能避免钓鱼、错误地址、假设备或不安全的备份。','客服可以索要我的助记词吗？','不可以。绝不要分享助记词、私钥或 PIN。','如果我泄露了助记词怎么办？','先假定钱包可能已被控制。从可信设备按官方指引保护剩余资产。不要给声称能追回资产的人付款。'],footer:'面向加密钱包持有者的独立安全教育内容。请勿在本网站输入助记词或私钥。',source:'仅供安全教育参考，不构成投资建议或安全审计。'};
T.en={name:'English',brand:'Crypto Wallet Safety',nav:['Before you transact','Wallet basics','Safety checklist','Scam watch','Quick answers'],hero:['CRYPTO WALLET SAFETY GUIDE','Before you send, swap or sign: pause.','An independent guide to checking addresses, networks and permissions before approving a transaction.','Start the 60-second check','See common scams','No wallet connection','We never ask for your recovery phrase'],quick:[['Protect your recovery phrase','No legitimate support agent, website or tool should ask for it.'],['Check before signing','Verify the full address, network and requested permission.'],['Pause when rushed','Guaranteed returns and unlock fees are warning signs.']],quiz:['60-SECOND FIELD CHECK','Would you spot these warning signs?','Three common situations. Choose a response to see why and what to do next. No wallet connection; answers are not saved.','Situation','Next situation','Finish check','Try again','You have completed the check.','If you feel rushed or unsure, pause. Verify through a separate official channel, read the exact transaction and never share your recovery phrase.',['A message says your wallet will be frozen in 10 minutes unless you act.','“Unusual activity. Enter your recovery phrase here to unlock your wallet.”','Open the link right away.','Close the link and verify through the official app or a known site. Never share the phrase.','A DApp asks for unlimited token approval for a small swap.','“Allow this contract to spend all your tokens.” You do not recognize the domain.','Approve because the logo looks familiar.','Cancel and verify the domain, contract and approval scope.','After a loss, a supposed recovery expert guarantees results for an upfront fee.','“Pay the tracing deposit first; we will recover your crypto.”','Pay a small amount to test them.','Stop contact, save evidence and ask your exchange or local authorities for help.'],['Urgency and a request for your phrase are clear scam signs. Close the message and verify through a separate official channel.','A legitimate site or support agent never needs your recovery phrase. Do not enter or share it.','Unlimited approval can put your tokens at risk. Cancel and check the details before signing.','A familiar logo does not prove a site is real. Verify the domain and requested permission.','Upfront fees to recover crypto are a strong scam warning.','Do not pay or allow remote access. Keep records and contact your platform and local authorities.']],basics:['THE BASICS','What to check before a transaction','Crypto assets are recorded on blockchains; a wallet manages the keys that authorize transactions. Self-custody also means backup responsibility.','Recovery phrase','Anyone who gets it can usually control the wallet. Keep it offline; never enter it on a website, chat or support form.','Address and network','Check the full receiving address and network on your device. Send a small test first to a new address.','Signatures and approvals','Check which contract gets access, which assets are affected and how broad the permission is. Cancel if it does not match what you expect.'],check:['BEFORE YOU TRANSACT','Five checks before you sign','Use this list as a reminder, not a guarantee of safety.','Open the app from an official source or trusted bookmark, not an unsolicited message.','Check the full receiving address and network before sending.','Read the transaction details and approval scope in your wallet before signing.','Ignore guaranteed returns, urgent giveaways and upfront recovery fees.','Keep recovery words private, offline and protected from loss or damage.','Check each item as you complete it. A full list does not guarantee a safe transaction.'],scams:['SCAM WATCH','Common wallet impersonation patterns','These examples describe scams that imitate wallet brands; they are not allegations against the named providers. Verify current information in the official app or site.','Legitimate support will never ask for your recovery phrase, private key or PIN.','Conclusion: if someone pressures you to share data, install a tool or sign something unclear, stop and verify independently.'],cards:[['TokenPocket','FAKE ADMIN','A group “admin” messages you privately','An impersonator may offer to fix an issue, then ask for a fee or your recovery phrase.','Warning sign: unsolicited DM or unlock fee.'],['imToken','FAKE APP','A look-alike wallet in search results','Fake apps and support may copy a name and icon to trick you into importing a wallet.','Warning sign: mismatched developer or altered domain.'],['TronLink','FAKE TOKEN / QR','Arbitrage or airdrop offers that ask you to send funds','Fake tokens or promotions may ask for USDT, a DApp connection or a QR scan.','Warning sign: send funds first to unlock a reward.'],['OneKey','TAMPERED DEVICE','A hardware wallet arrives “already initialized”','A card with recovery words already written could expose the wallet to someone else.','Warning sign: preset PIN or recovery phrase.'],['Bitget Wallet','PHISHING LINK','Prize or account-problem alerts','Fake messages and sites use urgency to push you to log in or connect your wallet.','Warning sign: countdown or unofficial domain.'],['MetaMask','FAKE SUPPORT','A “support engineer” asks for your phrase','Fake support may guide you to malicious extensions, sites or approvals.','Warning sign: phrase or remote access request.'],['Base App','FAKE REWARD','A supposed official Base token','Fake campaigns misuse brands to request a connection, signature or recovery details.','Warning sign: phrase required to claim a reward.'],['Trust Wallet','FAKE VERIFICATION','A page asks you to sync your wallet','A phishing page may request a connection and a dangerous signature.','Warning sign: verification page asks for recovery words.']],video:['SCAM AWARENESS VIDEO','Cryptocurrency investment fraud','The official FBI Operation Level Up video is embedded on this page. The original audio is English, with translated caption tracks available. Your browser may block autoplay.','Source: FBI · Operation Level Up'],faq:['QUICK ANSWERS','Common questions','Does a cold wallet remove every risk?','No. It reduces some online exposure, but not phishing, incorrect addresses, fake devices or unsafe backups.','Can support ask for my recovery phrase?','No. Never share your recovery phrase, private key or PIN.','What if I exposed my recovery phrase?','Assume the wallet may be compromised. Use a trusted device and official guidance to protect remaining assets. Do not pay supposed recovery agents.'],footer:'Independent safety education for cryptocurrency wallet holders. Never enter recovery phrases or private keys on this site.',source:'Educational information only; not investment advice or a security audit.'};

zh:{nav:'钱包怎么选',head:['怎么选择','按你的使用习惯选择钱包','不同方式在便利性、安全性和恢复责任之间各有取舍。没有一种钱包能消除所有风险。'],cols:['钱包类型','日常便利度','密钥隔离','恢复责任'],rows:[['硬件 / 冷钱包','中等','正确使用时较高','由你管理备份'],['手机 / 软件钱包','较高','保存在联网设备','由你管理备份'],['交易所账户','较高','由服务商保管密钥','账户访问取决于服务商']],steps:[['01 / 了解','先想清楚要保护什么','考虑需要保护的资产、交易频率，以及设备丢失后如何安全恢复访问。'],['02 / 核实','确认制造商与购买来源','从制造商或明确授权的卖家购买，并通过官方说明完成设置。'],['03 / 演练','先弄懂如何恢复','按制造商指引了解恢复流程，再决定是否存放重要资产。']]},
en:{nav:'Wallet types',head:['Compare wallet setups','Choose for the way you use it','Every setup trades convenience against security and recovery responsibility. No wallet type removes every risk.'],cols:['Wallet type','Everyday convenience','Key isolation','Recovery responsibility'],rows:[['Hardware / cold wallet','Medium','Higher when used correctly','You manage the backup'],['Mobile / software wallet','High','Connected device','You manage the backup'],['Exchange account','High','Provider holds the keys','Account access depends on provider']],steps:[['01 / LEARN','Start with what you need to protect','Consider what you need to protect, how often you transact and how you would recover access if a device is lost.'],['02 / VERIFY','Check the maker and source','Buy from the manufacturer or an explicitly authorized seller and follow verified setup instructions.'],['03 / PRACTICE','Understand recovery first','Follow the manufacturer’s guidance and understand recovery before storing meaningful value.']]},
es:{nav:'Tipos de wallet',head:['Compara las opciones','Elige según cómo la usarás','Cada configuración implica un equilibrio entre comodidad, seguridad y recuperación. Ningún tipo de cartera elimina todos los riesgos.'],cols:['Tipo de cartera','Comodidad diaria','Aislamiento de claves','Responsabilidad de recuperación'],rows:[['Hardware / fría','Media','Mayor si se usa correctamente','Tú gestionas la copia de seguridad'],['Móvil / software','Alta','Dispositivo conectado','Tú gestionas la copia de seguridad'],['Cuenta en exchange','Alta','El proveedor custodia las claves','El acceso depende del proveedor']],steps:[['01 / APRENDE','Define qué necesitas proteger','Considera qué activos quieres proteger, con qué frecuencia operas y cómo recuperarías el acceso si pierdes un dispositivo.'],['02 / VERIFICA','Comprueba fabricante y procedencia','Compra al fabricante o a un vendedor autorizado y confirma la configuración en las instrucciones oficiales.'],['03 / PRACTICA','Entiende la recuperación primero','Sigue las indicaciones del fabricante y asegúrate de conocer el proceso de recuperación antes de guardar fondos importantes.']]},
fr:{nav:'Types de portefeuille',head:['Comparer les options','Choisissez selon votre usage','Chaque configuration implique un compromis entre praticité, sécurité et récupération. Aucun type de portefeuille ne supprime tous les risques.'],cols:['Type de portefeuille','Praticité au quotidien','Isolement des clés','Responsabilité de récupération'],rows:[['Matériel / hors ligne','Moyenne','Plus élevé si bien utilisé','Vous gérez la sauvegarde'],['Mobile / logiciel','Élevée','Appareil connecté','Vous gérez la sauvegarde'],['Compte sur une plateforme','Élevée','Les clés sont détenues par le prestataire','L’accès dépend du prestataire']],steps:[['01 / COMPRENDRE','Définissez ce que vous protégez','Pensez aux actifs à protéger, à la fréquence des transactions et à la façon de récupérer l’accès en cas de perte d’un appareil.'],['02 / VÉRIFIER','Vérifiez le fabricant et la provenance','Achetez auprès du fabricant ou d’un revendeur autorisé et consultez les consignes officielles de configuration.'],['03 / S’ENTRAÎNER','Comprenez la récupération à l’avance','Suivez les instructions du fabricant et maîtrisez la récupération avant d’y stocker une valeur importante.']]},
de:{nav:'Wallet-Typen',head:['Optionen vergleichen','Wählen Sie passend zu Ihrer Nutzung','Jede Einrichtung ist ein Kompromiss zwischen Komfort, Sicherheit und Wiederherstellung. Kein Wallet-Typ beseitigt alle Risiken.'],cols:['Wallet-Typ','Komfort im Alltag','Trennung der Schlüssel','Verantwortung für Wiederherstellung'],rows:[['Hardware / Cold Wallet','Mittel','Höher bei korrekter Nutzung','Sie verwalten das Backup'],['Mobile / Software-Wallet','Hoch','Mit dem Gerät verbunden','Sie verwalten das Backup'],['Börsenkonto','Hoch','Anbieter verwahrt die Schlüssel','Kontozugriff hängt vom Anbieter ab']],steps:[['01 / VERSTEHEN','Legen Sie Ihr Schutzbedarf fest','Überlegen Sie, was Sie schützen, wie oft Sie Transaktionen ausführen und wie Sie den Zugriff nach Geräteverlust wiederherstellen.'],['02 / PRÜFEN','Hersteller und Bezugsquelle prüfen','Kaufen Sie beim Hersteller oder einem autorisierten Händler und nutzen Sie die offiziellen Einrichtungsanleitungen.'],['03 / ÜBEN','Wiederherstellung vorher verstehen','Folgen Sie den Herstellerhinweisen und verstehen Sie den Wiederherstellungsprozess, bevor Sie größere Werte verwahren.']]},

const CORE_WARNING={zh:["钱包绝不会要求你在线“验证”“解锁”或“认证”助记词。","不要把助记词输入网站、聊天、客服表单，也不要在屏幕共享时展示。"],en:["A wallet never needs your recovery phrase to “verify,” “unlock” or “validate” it online.","Never enter it on a website, in a chat or support form, or reveal it during screen sharing."],es:["Una wallet nunca necesita tu frase de recuperación para “verificar”, “desbloquear” o “validar” la wallet en línea.","No la introduzcas en sitios, chats o formularios de soporte ni la muestres al compartir pantalla."],fr:["Un portefeuille n’a jamais besoin de votre phrase de récupération pour la « vérifier », le « débloquer » ou le « valider » en ligne.","Ne la saisissez jamais sur un site, dans un chat ou un formulaire d’assistance, et ne la montrez pas en partage d’écran."],de:["Ein Wallet benötigt Ihre Wiederherstellungsphrase niemals, um es online zu „verifizieren“, „entsperren“ oder „validieren“.","Geben Sie sie niemals auf Websites, in Chats oder Supportformularen ein und zeigen Sie sie nicht bei einer Bildschirmfreigabe."],ja:["ウォレットの「確認」「ロック解除」「認証」に、オンラインでリカバリーフレーズを求められることはありません。","ウェブサイト、チャット、サポートフォームに入力せず、画面共有でも見せないでください。"],ko:["지갑을 온라인에서 “확인”, “잠금 해제”, “인증”하기 위해 복구 문구가 필요한 경우는 없습니다.","웹사이트, 채팅, 지원 양식에 입력하지 말고 화면 공유 중에도 보여주지 마세요."],pt:["Uma carteira nunca precisa da sua frase de recuperação para “verificar”, “desbloquear” ou “validar” algo online.","Nunca a digite em sites, chats ou formulários de suporte, nem a mostre durante o compartilhamento de tela."]};
